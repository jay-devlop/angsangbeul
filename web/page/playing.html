<section id="Playing" class="screen" hidden>

<div class="credit-card" data-credit data-lyrics-label="가사" data-no-lyrics-label="가사 없음" data-license-label="라이선스 보기"></div>
<dialog class="lyrics-dialog" data-role="lyricsDialog" aria-labelledby="lyricsTitle">
