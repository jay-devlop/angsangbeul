<!-- dialogs : 팝업창 마크업 (app.js 가 복제해서 화면에 띄움. 곡·플레이리스트 목록 같은 가변 부분만 JS 가 채움) -->
<!-- 이미지 편집 (플레이리스트 이미지·프로필 사진) -->
<template id="tplImageEditor">
<div class="image-editor-backdrop"><div class="image-editor" role="dialog" aria-modal="true" aria-labelledby="imageEditorTitle">
<h2 class="image-editor-title" id="imageEditorTitle">이미지 편집</h2>
<div class="image-editor-preview" aria-hidden="true"></div>
<div class="image-editor-option-row"><div class="image-editor-label">색상 선택</div><div class="image-editor-colors"></div></div>
<div class="image-editor-option-row"><div class="image-editor-label">사진 업로드</div><button type="button" class="image-editor-upload" aria-label="사진 업로드" title="사진 업로드"><img src="icon/upload.png" alt=""></button></div>
<div class="image-editor-actions"><button type="button" class="btn-secondary" data-image-editor-cancel>취소</button><button type="button" class="btn-primary--half" data-image-editor-save>저장</button></div>
</div></div>
</template>
<!-- 플레이리스트에 추가 (곡 옆 + 버튼) -->
<template id="tplPlaylistPicker">
<div class="playlist-picker-backdrop"><div class="playlist-picker" role="dialog" aria-modal="true" aria-labelledby="playlistPickerTitle">
<h2 id="playlistPickerTitle" class="section-title">플레이리스트에 추가</h2>
<button type="button" class="playlist-picker-close" aria-label="닫기">×</button>
<p class="caption" data-picker-empty>먼저 플레이리스트를 만들어 주세요.</p>
<a href="#NewPlaylist" class="btn-primary" data-picker-create>새 플레이리스트 만들기</a>
<div class="playlist-picker-options"></div>
</div></div>
</template>
<!-- 구글로 처음 로그인했을 때: 취향(장르) 선택 팝업. 닫기 버튼 없음, '시작하기' 하나로 바로 홈으로 -->
<template id="tplGenrePicker">
<div class="genre-picker-backdrop"><div class="genre-picker" role="dialog" aria-modal="true" aria-labelledby="genrePickerTitle">
<div><h2 id="genrePickerTitle" class="section-title">좋아하는 장르를 골라 주세요</h2><div class="section-sub">최대 3개까지 고를 수 있어요. 첫 추천에 쓰이고, 나중에 바꿀 수 있어요.</div></div>
<div class="genre-picker-chips" data-picker-genres></div>
<a href="#Main" class="btn-primary" data-genre-start aria-disabled="true">시작하기</a>
</div></div>
</template>
<!-- 비밀번호 찾기: 이메일을 입력하면 비밀번호 재설정 링크를 메일로 보냄 (비밀번호 자체는 어디에도 저장·표시되지 않음) -->
<template id="tplForgotPassword">
<div class="forgot-backdrop"><div class="forgot-dialog" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
<button type="button" class="forgot-close" aria-label="닫기">×</button>
<div><h2 id="forgotTitle" class="section-title">비밀번호 찾기</h2><div class="section-sub">가입한 이메일을 입력하면 비밀번호를 새로 정할 수 있는 링크를 보내 드려요.</div></div>
<div><label class="field-label">이메일</label><input type="email" class="input" data-forgot-email placeholder="name@example.com" autocomplete="email"></div>
<div class="forgot-result" data-forgot-result role="status" aria-live="polite" hidden></div>
<a href="#" class="btn-primary" data-forgot-send>재설정 링크 보내기</a>
</div></div>
</template>
<!-- 이메일 인증: 가입 직후(또는 인증 전 로그인 시) 뜨는 팝업. 인증이 끝나야 닫힘 -->
<template id="tplVerifyEmail">
<div class="verify-backdrop"><div class="verify-dialog" role="dialog" aria-modal="true" aria-labelledby="verifyTitle">
<div><h2 id="verifyTitle" class="section-title">이메일을 인증해 주세요</h2><div class="section-sub"><span data-verify-email></span>(으)로 인증 메일을 보냈어요. 메일의 링크를 누른 뒤 아래 버튼을 눌러 주세요. 메일이 안 보이면 스팸함도 확인해 주세요.</div></div>
<div class="forgot-result" data-verify-result role="status" aria-live="polite" hidden></div>
<div class="verify-actions">
<a href="#" class="btn-primary" data-verify-done>인증했어요</a>
<button type="button" class="verify-link" data-verify-resend>인증 메일 다시 보내기</button>
<button type="button" class="verify-link" data-verify-logout>다른 계정으로 로그인</button>
</div>
</div></div>
</template>
