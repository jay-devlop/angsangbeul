<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앙상블</title>
<meta name="description" content="취향에 맞는 음악을 추천해주는 뮤직 스트리밍">
<meta name="theme-color" content="#0e0e12">
<!-- 사이트 아이콘(브라우저 탭·홈 화면): 로고 headphone.png 를 정사각형으로 만든 것 -->
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon/favicon-192.png">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<!-- 링크 공유 미리보기(카카오톡·슬랙·페이스북·트위터 등): 로고 이미지 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="앙상블">
<meta property="og:title" content="앙상블">
<meta property="og:description" content="취향에 맞는 음악을 추천해주는 뮤직 스트리밍">
<meta property="og:image" content="/icon/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="앙상블">
<meta name="twitter:description" content="취향에 맞는 음악을 추천해주는 뮤직 스트리밍">
<meta name="twitter:image" content="/icon/og-image.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=111">
</head>
<body class="auth-pending">
<!-- 상단 헤더: js가 page/header.html 을 불러와 여기에 넣음 (로그인 화면에서는 숨김) -->
<header class="app-header" id="appHeader"></header>
<!-- 화면들: js가 page/*.html 을 불러와 여기에 넣음 -->
<div id="pages"></div>
<!-- 알림창(위쪽에 잠깐 떴다 사라짐): 추천 갱신 진행 등 -->
<div class="app-toast" id="appToast" role="status" aria-live="polite" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="appToastText"></span></div>
<!-- 음악 재생용 오디오 (한 번에 한 곡, 사용자가 곡을 눌러야 재생됨) -->
<audio id="audio" preload="none"></audio>
<!-- 동작: 화면 이동·재생·검색·좋아요 등 -->
<script src="js/app.js?v=103"></script>
<!-- 사용자 데이터 저장(Firebase): 로그인(익명)·Firestore 동기화. 실패해도 앱은 localStorage 로 그대로 동작 -->
<script type="module" src="js/firebase.js"></script>
</body>
</html>
